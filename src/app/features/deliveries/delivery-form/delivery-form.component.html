<!-- features/delivery/delivery-form/delivery-form.component.html -->
<div class="delivery-form-container">
  <h1 class="form-title">
    <i class="fas fa-truck"></i>
    Nueva Entrega
  </h1>

  <form (ngSubmit)="onSubmit()" #deliveryForm="ngForm">
    <!-- Información General -->
    <fieldset>
      <legend>Información General</legend>

      <div class="form-group">
        <label for="fecha">Fecha de Entrega:</label>
        <input
          type="datetime-local"
          id="fecha"
          name="fecha"
          [(ngModel)]="delivery.fecha"
          required
        />
      </div>

      <div class="form-group">
        <label for="cliente">Cliente:</label>
        <select id="cliente" name="cliente" [(ngModel)]="delivery.cliente" required>
          <option value="" disabled selected>Selecciona un cliente</option>
          <option *ngFor="let cliente of clients()" [ngValue]="cliente">
            {{ cliente.nombre }} {{ cliente.apellido }} (ID: {{ cliente.idCliente }})
          </option>
        </select>
        <button type="button" class="btn-add-client" (click)="openClientModal()">
          <i class="fas fa-plus"></i>
          Agregar Cliente
        </button>

        <label for="observacion">Observaciones:</label>
        <textarea
          id="observacion"
          name="observacion"
          [(ngModel)]="delivery.observacion"
          rows="3"
        ></textarea>
      </div>

    </fieldset>

    <!-- Detalles de los Materiales -->
    <fieldset>
      <legend>Detalles de los Materiales</legend>

      <div class="materials-table-container">
        <table class="materials-table">
          <thead>
          <tr>
            <th>Artículo</th>
            <th>Cantidad</th>
            <th>Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let detalle of delivery.detalles; let i = index">
            <td>
              {{ detalle.product.articulo }}
            </td>
            <td>
              {{ detalle.cantidad }}
            </td>
            <td>
              <button type="button" class="btn-delete-material" (click)="removeMaterial(i)">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="add-material-section">
        <label for="product">Agregar Material:</label>
        <select id="product" name="product" [(ngModel)]="selectedProduct">
          <option value="" disabled selected>Selecciona un artículo</option>
          <option *ngFor="let product of products()" [ngValue]="product">
            {{ product.articulo }} (Stock: {{ product.stock }})
          </option>
        </select>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" [(ngModel)]="quantity" min="1" />

        <button type="button" class="btn-add-material" (click)="addMaterial()">
          <i class="fas fa-plus"></i>
          Agregar
        </button>
      </div>
    </fieldset>

    <!-- Asignación de Responsable -->
    <fieldset>
      <legend>Asignación de Responsable</legend>

      <div class="form-group">
        <label for="user">Responsable:</label>
        <select id="user" name="user" [(ngModel)]="delivery.user">
          <option value="" disabled selected>Selecciona un responsable</option>
          <option *ngFor="let user of users" [ngValue]="user">
            <!--{{ user.email }}-->
          </option>
        </select>
      </div>
    </fieldset>

    <!-- Acciones del Formulario -->
    <div class="form-actions">
      <button type="submit" class="btn-guardar" [disabled]="!deliveryForm.form.valid">
        <i class="fas fa-save"></i>
        Guardar Entrega
      </button>
      <button type="button" class="btn-cancelar" routerLink="/delivery">
        <i class="fas fa-times"></i>
        Cancelar
      </button>
    </div>
  </form>
</div>
