<div class="login-container">

  <!-- PANEL IZQUIERDO -->
  <div class="login-left">
    <div class="spheres">
      <div class="sphere-large"></div>
      <div class="sphere-medium"></div>
      <div class="sphere-small"></div>
    </div>
    <div class="brand-content">
      <h1 class="logo-text">
        <i class="fas fa-infinity logo-icon"></i>
        SIN <span class="highlight">LIMITE</span>
      </h1>
      <h2 class="welcome-text">
        <i class="fas fa-hand-wave welcome-icon"></i>
        Bienvenido de nuevo
      </h2>
    </div>
  </div>

  <!-- PANEL DERECHO - Mismo tamaño que el panel izquierdo -->
  <div class="login-right">
    <div class="login-card">
      <div class="form-separator">
        <i class="fas fa-minus separator-icon"></i>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        @if (error()) {
          <div class="login-alert" role="alert">
            <i class="fas fa-triangle-exclamation"></i>
            <span>{{ error() }}</span>
          </div>
        }

        <!-- USUARIO -->
        <div class="form-group">
          <label class="form-label" for="login-email">
            <i class="fas fa-user form-icon"></i>
            Usuario
          </label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="login-email"
              formControlName="email"
              placeholder="correo@empresa.com"
              class="form-input"
              autocomplete="username"
              [attr.aria-invalid]="hasError('email', 'required') || hasError('email', 'email')"
            />
          </div>
          @if (hasError('email', 'required')) {
            <p class="error-text">
              <i class="fas fa-exclamation-circle error-icon"></i>
              El usuario es requerido
            </p>
          } @else if (hasError('email', 'email')) {
            <p class="error-text">
              <i class="fas fa-exclamation-circle error-icon"></i>
              Escribe un correo válido
            </p>
          }
        </div>

        <!-- CONTRASEÑA -->
        <div class="form-group">
          <label class="form-label" for="login-password">
            <i class="fas fa-key form-icon"></i>
            Contraseña
          </label>
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="login-password"
              formControlName="password"
              placeholder="••••••••"
              class="form-input"
              autocomplete="current-password"
            />
            <button type="button" (click)="togglePassword()" class="eye-btn"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [attr.aria-pressed]="showPassword()">
              <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
            </button>
          </div>
          @if (hasError('password', 'required')) {
            <p class="error-text">
              <i class="fas fa-exclamation-circle error-icon"></i>
              La contraseña es requerida
            </p>
          }
        </div>

        <!-- OPCIONES -->
        <div class="options">
          <label class="remember">
            <input type="checkbox" class="checkbox" [checked]="recordar()" (change)="toggleRecordar()" />
            <i class="fas fa-check check-icon"></i>
            <span class="checkbox-label">Recordarme</span>
          </label>
          <a href="#" class="forgot-password" (click)="olvidoClave($event)">
            <i class="fas fa-question-circle forgot-icon"></i>
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <div class="form-separator">
          <i class="fas fa-minus separator-icon"></i>
        </div>

        <!-- BOTÓN -->
        <button type="submit" [disabled]="loading()" class="login-btn">
          @if (loading()) {
            <i class="fas fa-spinner fa-spin loading-icon"></i>
            Iniciando...
          } @else {
            <i class="fas fa-sign-in-alt btn-icon"></i>
            Iniciar Sesión
          }
        </button>

      </form>
    </div>
  </div>

</div>
